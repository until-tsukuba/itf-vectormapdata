name: Overpass API経由でデータを取得してアップロードします

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: '0 21 */2 * *'

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: pnpmをセットアップ
        uses: pnpm/action-setup@v4
        with: 
          version: '10'
          cache: 'true'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' 
          cache: 'pnpm' # pnpmのキャッシュを有効化

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch data from Overpass API
        run: node scripts/fetchtooverpass.js

      - name: Upload GeoJSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: itfvectormap.geojson # アーティファクト名
          path: public/itfvectormap.geojson # アップロードするファイルのパス

      - name: Install tippecanoe
        run: sudo apt update && sudo apt install -y tippecanoe

      # --no-tile-compression は必須。既定のgzip出力はCloudflare PagesがContent-Encodingを
      # 付けずに配信するため、QGIS等が読めなくなる。
      # -Z0 も必須。低ズームのタイルが無いと、縮小表示したQGISが最小ズーム(-Z)の解像度で
      # 表示範囲全体をタイル分割し、数千枚のリクエストを投げてタイムアウトする。
      # 対象範囲が狭いので低ズーム側は各1枚程度しか増えない。
      - name: PBFタイルを生成
        run:
          tippecanoe -e public/tiles --force -Z0 -z18 --no-tile-compression public/itfvectormap.geojson

      # 空のデータで既存の配信内容を上書きしないための保険
      - name: 生成物を検証
        run: |
          test -s public/itfvectormap.geojson
          tile_count=$(find public/tiles -name '*.pbf' | wc -l)
          echo "生成されたタイル数: $tile_count"
          test "$tile_count" -gt 0

      - name: Upload PBF Tile Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiles
          path: public/tiles/

      - name: Astroサイトをビルド
        run: pnpm build

      - name: Cloudflare Pagesにデプロイ
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}